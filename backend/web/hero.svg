<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c66b"/><stop offset="1" stop-color="#e2731f"/></linearGradient>
    <linearGradient id="deskg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#5e3b1a"/></linearGradient>
    <clipPath id="arch"><path d="M120 420V220a80 80 0 0 1 160 0v200z"/></clipPath>
  </defs>
  <!-- outer arch frame -->
  <path d="M95 440V215a105 105 0 0 1 210 0v225z" fill="#0b2f52"/>
  <path d="M108 440V218a92 92 0 0 1 184 0v222z" fill="none" stroke="#e68a1e" stroke-opacity=".5" stroke-width="2"/>
  <!-- sunset through the arch -->
  <g clip-path="url(#arch)">
    <rect x="120" y="140" width="160" height="300" fill="url(#sky)"/>
    <circle cx="200" cy="300" r="46" fill="#fbe3a6" opacity=".9"/>
    <path d="M110 420c20-30 40-40 60-40 10-60 30-70 40-70s30 10 40 70c20 0 40 10 60 40z" fill="#9a4d16" opacity=".7"/>
    <path d="M150 345h100v75H150z" fill="#7b3a10"/>
    <path d="M160 345a40 40 0 0 1 80 0z" fill="#7b3a10"/>
    <path d="M140 360h20v60h-20zM240 360h20v60h-20z" fill="#7b3a10"/>
    <path d="M300 250c-15 8-25 20-25 35h50c0-15-10-27-25-35z" fill="#7b3a10" opacity=".6"/>
    <path d="M110 280q30-12 60 0" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <path d="M140 262q14-7 28 0" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- desk -->
  <rect x="0" y="420" width="400" height="100" fill="url(#deskg)"/>
  <rect x="0" y="414" width="400" height="10" fill="#a9712f"/>
  <!-- microphone -->
  <g transform="translate(150 250)">
    <rect x="22" y="150" width="16" height="34" fill="#6b6b6b"/>
    <rect x="0" y="180" width="60" height="10" rx="5" fill="#4f4f4f"/>
    <rect x="0" y="0" width="60" height="140" rx="30" fill="#c9cdd2"/>
    <rect x="0" y="0" width="60" height="140" rx="30" fill="none" stroke="#7d8389" stroke-width="3"/>
    <g stroke="#7d8389" stroke-width="3">
      <line x1="8" y1="25" x2="52" y2="25"/><line x1="4" y1="45" x2="56" y2="45"/><line x1="4" y1="65" x2="56" y2="65"/><line x1="4" y1="85" x2="56" y2="85"/><line x1="8" y1="105" x2="52" y2="105"/>
    </g>
    <rect x="-10" y="60" width="80" height="12" rx="6" fill="#e68a1e"/>
  </g>
  <!-- telephone -->
  <g transform="translate(228 345)">
    <path d="M10 60h100a10 10 0 0 1 10 10v10H0V70a10 10 0 0 1 10-10z" fill="#1d1d1f"/>
    <rect x="20" y="30" width="80" height="34" rx="8" fill="#2a2a2d"/>
    <circle cx="60" cy="50" r="16" fill="#3a3a3e"/>
    <circle cx="60" cy="50" r="7" fill="#e68a1e"/>
    <path d="M12 26c0-12 10-18 20-14l10 4c-2 8-2 14 0 22l-8 6c-14-2-22-8-22-18zM108 26c0-12-10-18-20-14l-10 4c2 8 2 14 0 22l8 6c14-2 22-8 22-18z" fill="#1d1d1f"/>
    <rect x="30" y="14" width="60" height="10" rx="5" fill="#1d1d1f"/>
  </g>
  <!-- paper + pen -->
  <path d="M30 455l90-10 4 40-90 10z" fill="#fbf6ea"/>
  <path d="M40 470l70-7M42 480l55-5" stroke="#d8cfbd" stroke-width="2"/>
  <path d="M60 492l60-18" stroke="#1d2a3a" stroke-width="5" stroke-linecap="round"/>
  <!-- plant -->
  <path d="M30 420c-20-20-30-50-10-80 10 30 20 50 10 80zM32 420c0-30 10-60 40-70-10 30-20 50-40 70z" fill="#2f7a4a"/>
  <!-- books -->
  <rect x="300" y="396" width="90" height="12" rx="2" fill="#b43b2e"/>
  <rect x="306" y="408" width="84" height="10" rx="2" fill="#2f5d8a"/>
</svg>
